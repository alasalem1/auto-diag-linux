DISTRO_NAME = "AutoDiag Linux"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "scarthgap"
INIT_MANAGER = "systemd"

# Include operating system identification
CORE_IMAGE_EXTRA_INSTALL += " os-release"

# Automotive CAN support
IMAGE_INSTALL:append = " \
    kernel-module-vcan \
    kernel-module-can-isotp \
"

# Enable package-level automated testing
DISTRO_FEATURES:append = " ptest"


# CAN diagnostic and testing utilities
IMAGE_INSTALL:append = " can-utils"

# AutoDiag ISO-TP diagnostic application
IMAGE_INSTALL:append = " autodiag-isotp-test"

# AutoDiag simulated ECU
IMAGE_INSTALL:append = " autodiag-ecu"

# Include automated UDS tests in the development image
IMAGE_INSTALL:append = " autodiag-ecu-ptest ptest-runner"

# AutoDiag Qt 6 diagnostic graphical interface
IMAGE_INSTALL:append = " autodiag-gui qtbase qtbase-plugins"

# DejaVu fonts for Qt GUI text rendering
IMAGE_INSTALL:append = " ttf-dejavu-sans"
