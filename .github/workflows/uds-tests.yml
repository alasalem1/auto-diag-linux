name: AutoDiag UDS Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  uds-tests:
    name: Build and run UDS tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run UDS and persistence tests
        run: ./tests/run-uds-tests.sh

      - name: Check patch formatting
        run: git diff --check HEAD^ HEAD
